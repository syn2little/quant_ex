market:
  name: "csi300"
  benchmark: "SH000300"

strategy:
  topk_dropout:
    topk: 15
    n_drop: 3
    hold_thresh: 5
  universe_filter:
    exclude_kcb: true
    exclude_list: []
    min_price: 3
    exclude_st: true
    exclude_suspended: true

model:
  features:
    factors:
      - name: "technical"
        ma_pairs: [[5, 20], [10, 60]]
        rsi_windows: [14, 20]
        bb_windows: [20]
        atr_windows: [14]
        obv_windows: [10, 20]
        vwap_windows: [5, 10, 20]
      - name: "sector"
        momentum_windows: [5, 10, 20, 60]
        reversal_windows: [5, 20]

daily_rebalance:
  market: "csi300"
  topk: 15
  n_drop: 3
  # Emergency baseline mode: disable hold protection so the baseline can make
  # an immediate full rebalance from the supplied real-account positions.
  hold_thresh: 0
  account: 150000
  notify_channel: "bark"
  start_date: "2024-01-01"
  model_path: "models/lgbm_csi1000_balanced_20260429_002424.pkl"
  min_action_value: 1000
  cache_roll_forward_positions: false
